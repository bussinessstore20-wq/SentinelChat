services:
  - type: web
    name: sentinelchat
    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app.main:api --host 0.0.0.0 --port $PORT

    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: TELEGRAM_MODE
        value: webhook

      - key: TELEGRAM_WEBHOOK_URL
        sync: false

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_SECRET_KEY
        sync: false

      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      - key: APP_ENV
        value: production

      - key: DASHBOARD_TOKEN
        sync: false
